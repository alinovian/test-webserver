<VirtualHost *:80>
    ServerName alinovian.id
    ServerAlias www.alinovian.id
    ServerAdmin webmaster@alinovian.id
    DocumentRoot /var/www/alinovian

    <Directory /var/www/alinovian>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/alinovian_error.log
    CustomLog ${APACHE_LOG_DIR}/alinovian_access.log combined
</VirtualHost>
