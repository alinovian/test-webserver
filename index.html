<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Novian</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* Main Card Container */
        .card {
            display: flex;
            width: 100%;
            max-width: 760px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* Left Side Panel (Gradient) */
        .left-panel {
            background: linear-gradient(180deg, #7c3aed 0%, #4f46e5 100%);
            width: 38%;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
        }

        .avatar-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.9);
            overflow: hidden;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background-color: #f1f5f9;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 1.65rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }

        .nim {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 0.05em;
        }

        /* Right Side Panel (Biodata Info) */
        .right-panel {
            width: 62%;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .biodata-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        /* Info Item Cards */
        .info-item {
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 1.1rem 1.25rem;
            margin-bottom: 1rem;
            border: 1px solid #f1f5f9;
        }

        .info-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background-color: rgba(99, 102, 241, 0.1);
            color: #4f46e5;
            border-radius: 10px;
            margin-right: 1rem;
            font-size: 1.15rem;
        }

        .info-details {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #4f46e5;
            letter-spacing: 0.02em;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 1.05rem;
            color: #334155;
            font-weight: 500;
        }

        /* Social Media Icons */
        .social-section {
            text-align: center;
            margin-top: 1.5rem;
        }

        .social-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
        }

        .social-link {
            color: #475569;
            font-size: 1.35rem;
            text-decoration: none;
            transition: color 0.2s, transform 0.2s;
        }

        .social-link:hover {
            color: #4f46e5;
            transform: translateY(-2px);
        }

        /* Responsive Layout for Mobile */
        @media (max-width: 680px) {
            .card {
                flex-direction: column;
                max-width: 400px;
            }

            .left-panel {
                width: 100%;
                padding: 2.5rem 1.5rem;
            }

            .right-panel {
                width: 100%;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- Left Column -->
        <div class="left-panel">
            <div class="avatar-container">
                <!-- Fallback to initials if profile image does not exist -->
                <img class="avatar" src="Portfolio Profil Onthel.jpg" alt="Ali Novian"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="avatar"
                    style="display:none; justify-content:center; align-items:center; background: linear-gradient(135deg, #7c3aed, #4f46e5); color:#fff; font-size:2.8rem; font-weight:800;">
                    AN
                </div>
            </div>
            <h1 class="name">Ali Novian</h1>
            <p class="nim">(23SA11A147)</p>
        </div>

        <!-- Right Column -->
        <div class="right-panel">
            <div>
                <h2 class="biodata-title">Biodata</h2>

                <!-- Program Studi Block -->
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-label">Program Studi</span>
                        <span class="info-value">Informatika</span>
                    </div>
                </div>

                <!-- Kelas / Jaringan Komputer Block -->
                <div class="info-item">
                    <div class="info-icon">
                        <i class="fa-solid fa-network-wired"></i>
                    </div>
                    <div class="info-details">
                        <span class="info-label">Kelas & Mata Kuliah</span>
                        <span class="info-value">IF23C - Jaringan Komputer</span>
                    </div>
                </div>
            </div>

            <!-- Social Connect Section -->
            <div class="social-section">
                <h3 class="social-title">Terhubung Dengan Saya</h3>
                <div class="social-links">
                    <a href="https://instagram.com/ali_novian" target="_blank" class="social-link"><i
                            class="fa-brands fa-instagram"></i></a>
                    <a href="https://linkedin.com/in/alinovian" target="_blank" class="social-link"><i
                            class="fa-brands fa-linkedin"></i></a>
                    <a href="https://github.com/alinovian" target="_blank" class="social-link"><i
                            class="fa-brands fa-github"></i></a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
